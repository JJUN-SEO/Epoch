name: Installers

# Builds each OS's installers on that OS (native modules match the runner),
# with checksums and a size table (ADR-018). Runs on pushes that change what
# goes into the app, by hand, and from release.yml for a tag. Nothing here can
# publish: the token is read-only and electron-builder gets none.
on:
  workflow_call:
  workflow_dispatch:
  push:
    # Branches only: a tag runs this through release.yml instead.
    branches: ["**"]
    paths:
      - "packages/app/**"
      - "packages/core/**"
      - "packages/engine/**"
      - "packages/adapters/**"
      - "packages/findings/**"
      - "packages/scorers/**"
      - "packages/ui/**"
      - "models/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/installers.yml"
      - "scripts/checksums.mjs"
      - "scripts/package-size.mjs"
      - "scripts/fetch-model.mjs"

# A started run finishes (its smoke test is the signal); a newer push waits,
# and replaces any run still waiting.
concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: darwin
            unpacked: packages/app/release/mac-arm64/Epoch.app
          - os: windows-2025
            platform: win32
            unpacked: packages/app/release/win-unpacked
          - os: ubuntu-24.04
            platform: linux
            unpacked: packages/app/release/linux-unpacked
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the app
        run: node scripts/turbo.mjs run build --filter=@epoch-dev/app...

      # The local embedding model the installers carry (ADR-008), from its
      # pinned revision and checked against its sha256.
      - name: Fetch the embedding model
        run: node scripts/fetch-model.mjs

      # Unsigned apart from macOS's ad-hoc signature (electron-builder.yml):
      # no certificate is looked up, and with no token nothing is published.
      - name: Build the installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @epoch-dev/app package:installer

      - name: Checksums
        run: >-
          node scripts/checksums.mjs packages/app/release
          --os ${{ matrix.platform }}
          --out packages/app/release/SHA256SUMS-${{ matrix.platform }}.txt
          && cat packages/app/release/SHA256SUMS-${{ matrix.platform }}.txt

      - name: Sizes
        run: |
          node scripts/package-size.mjs "${{ matrix.unpacked }}" \
            --installers packages/app/release \
            --label "${{ matrix.os }}" \
            --out packages/app/release/size-${{ matrix.platform }}.md
          cat packages/app/release/size-${{ matrix.platform }}.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.platform }}
          path: |
            packages/app/release/Epoch-*
            packages/app/release/SHA256SUMS-${{ matrix.platform }}.txt
            packages/app/release/size-${{ matrix.platform }}.md
          if-no-files-found: error
          retention-days: 7

  # The clean-machine smoke test (PLAN.md M8): a fresh runner per installer,
  # with no Electron and no build of the app. It installs the artifact the way
  # a user would and drives the installed app over Chromium's debugging port
  # (packages/app/smoke): open a real repository, blast radius, the findings
  # banner, offline mode, and Chromium's network log from launch to quit.
  smoke:
    name: smoke (${{ matrix.leg }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: macOS dmg
            os: macos-26
            platform: darwin
          - leg: Windows NSIS
            os: windows-2025
            platform: win32
          # No sysctl change: the deb's AppArmor profile lets Chromium's
          # sandbox run on stock Ubuntu 24.04.
          - leg: Ubuntu deb
            os: ubuntu-24.04
            platform: linux
            kind: deb
          - leg: Ubuntu AppImage
            os: ubuntu-24.04
            platform: linux
            kind: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HEADLESS: ${{ startsWith(matrix.os, 'ubuntu') && 'xvfb-run -a' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The test's own dependencies (Playwright, @electron/fuses). Electron
      # has no install script, so no development Electron lands here.
      - run: pnpm install --frozen-lockfile

      # A real repository with its full history (risk tiers and findings use
      # git): zod at the commit the benchmarks pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: colinhacks/zod
          ref: 680d19f7d1e042e55934209caeb79bc843b94f44
          path: smoke-repo
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-${{ matrix.platform }}
          path: installer

      - name: Verify the checksums
        working-directory: installer
        run: |
          if command -v sha256sum > /dev/null; then
            sha256sum -c SHA256SUMS-${{ matrix.platform }}.txt
          else
            shasum -a 256 -c SHA256SUMS-${{ matrix.platform }}.txt
          fi

      - name: Install (macOS)
        if: matrix.platform == 'darwin'
        run: |
          hdiutil attach installer/Epoch-mac-arm64.dmg -nobrowse -mountpoint /tmp/epoch-dmg
          cp -R /tmp/epoch-dmg/Epoch.app /Applications/
          hdiutil detach /tmp/epoch-dmg
          codesign --verify --deep --strict --verbose=2 /Applications/Epoch.app
          echo "EPOCH_SMOKE_EXE=/Applications/Epoch.app/Contents/MacOS/Epoch" >> "$GITHUB_ENV"

      - name: Install (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          Start-Process -FilePath installer\Epoch-win-x64-setup.exe -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Epoch\Epoch.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          # A one-click installer may start the app; the test starts its own.
          Stop-Process -Name Epoch -ErrorAction SilentlyContinue
          "EPOCH_SMOKE_EXE=$exe" >> $env:GITHUB_ENV

      - name: Install (deb)
        if: matrix.kind == 'deb'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ./installer/Epoch-linux-x64.deb
          echo "EPOCH_SMOKE_EXE=/opt/Epoch/epoch" >> "$GITHUB_ENV"

      # An AppImage installs nothing. Ubuntu 24.04 confines unprivileged user
      # namespaces, which Chromium's sandbox needs, and it ships no FUSE 2
      # for the AppImage runtime (the README says so); the runtime extracts
      # itself instead, and the test reads the fuses of the extracted binary.
      - name: Prepare (AppImage)
        if: matrix.kind == 'appimage'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          chmod +x installer/Epoch-linux-x64.AppImage
          (cd installer && ./Epoch-linux-x64.AppImage --appimage-extract > /dev/null)
          {
            echo "EPOCH_SMOKE_EXE=$PWD/installer/Epoch-linux-x64.AppImage"
            echo "EPOCH_SMOKE_FUSES=$PWD/installer/squashfs-root/epoch"
            echo "APPIMAGE_EXTRACT_AND_RUN=1"
          } >> "$GITHUB_ENV"

      - name: Smoke test
        env:
          EPOCH_SMOKE_REPO: ${{ github.workspace }}/smoke-repo
        run: $HEADLESS pnpm --filter @epoch-dev/app smoke

      - name: Uninstall (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Epoch'
          Start-Process -FilePath (Join-Path $dir 'Uninstall Epoch.exe') -ArgumentList '/S' -Wait
          # The uninstaller hands off to a copy of itself; wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'Epoch.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'Epoch.exe')) { throw "still installed in $dir" }

      - name: Uninstall (deb)
        if: matrix.kind == 'deb'
        run: |
          sudo apt-get remove -y epoch
          test ! -e /opt/Epoch/epoch

      - name: Keep smoke results of a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-results-${{ matrix.platform }}-${{ matrix.kind || 'app' }}
          path: packages/app/test-results
          if-no-files-found: ignore
          retention-days: 7
