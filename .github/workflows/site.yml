name: Site

# GitHub Pages uses the GitHub Actions source. Only main deploys; a dispatch
# lets the maintainer retry after changing Pages settings.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/core/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
      - "scripts/site-size.mjs"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build the static site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/turbo.mjs run build --filter=@epoch-dev/site...
      - run: node scripts/site-size.mjs apps/site/dist
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/site/dist

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
