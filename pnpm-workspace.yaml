# https://pnpm.io/workspaces
packages:
  - packages/*
  - packages/adapters/*

# Shared exact versions; packages reference them as "catalog:".
# https://pnpm.io/catalogs
catalog:
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.2
  "@vitejs/plugin-react": 5.2.0
  "@vscode/tree-sitter-wasm": 0.3.1
  better-sqlite3: 13.0.3
  eslint: 10.12.0
  piscina: 5.3.2
  typescript: 6.0.3
  vite: 7.3.6
  vitest: 5.0.4
  web-tree-sitter: 0.27.1
  zod: 4.6.7

# Fail install when the running Node does not satisfy `engines`. pnpm's docs say
# a root mismatch always fails, but pnpm 11.28.2 only warns without this
# (verified; ADR-010). https://pnpm.io/settings/cli#enginestrict
engineStrict: true

# No update checks from pnpm.
updateNotifier: false

# Dependency install scripts run only when listed here (strictDepBuilds is on by
# default). Add each one deliberately, with the reason in the commit message.
# https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  # esbuild (via Vite) has a postinstall that only verifies its platform
  # binary, which arrives as an optional dependency; denied, and builds work
  # without it (verified when M3 added the UI).
  esbuild: false
  # electron-winstaller (via electron-builder) copies a 7-Zip binary for
  # Squirrel.Windows installers; Epoch ships NSIS on Windows, so it is unused.
  electron-winstaller: false
  # onnxruntime-node (the local embedding model, ADR-008) ships its CPU
  # binaries in the package; its install script only downloads optional GPU
  # providers (CUDA, TensorRT), which Epoch does not use.
  onnxruntime-node: false
