<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Epoch's app icon: one file and the files around it, joined like neurons.
    Drawn by hand; packages/app/scripts/render-icon.mjs renders it to
    icon.png, from which electron-builder makes the icns, ico and Linux icons.
    The body sits on Apple's 824-unit grid (100 units of margin per side).
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b44"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b4b5ff"/>
      <stop offset="1" stop-color="#6f70ee"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <g stroke="#ececf1" stroke-opacity="0.5" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M512 512 L512 262"/>
    <path d="M512 512 L750 435"/>
    <path d="M512 512 L659 714"/>
    <path d="M512 512 L365 714"/>
    <path d="M512 512 L274 435"/>
    <path d="M512 262 Q660 300 750 435"/>
    <path d="M274 435 Q290 610 365 714"/>
  </g>
  <circle cx="512" cy="262" r="54" fill="#2dd4bf"/>
  <circle cx="750" cy="435" r="54" fill="#f6a35c"/>
  <circle cx="659" cy="714" r="54" fill="#f6a35c"/>
  <circle cx="365" cy="714" r="54" fill="#ececf1"/>
  <circle cx="274" cy="435" r="54" fill="#2dd4bf"/>
  <circle cx="512" cy="512" r="104" fill="url(#core)"/>
</svg>
